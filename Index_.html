<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escudo Legal - Protección Ciudadana</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #050a14 0%, #0a1628 100%);
            color: white;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Pantalla de Carga */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: #050a14;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.8s ease;
        }

        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .shield-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px #00a2ff);
            animation: shield-glow 2s ease-in-out infinite;
        }

        @keyframes shield-glow {
            0%, 100% { filter: drop-shadow(0 0 15px #00a2ff); }
            50% { filter: drop-shadow(0 0 25px #00d4ff); }
        }

        .loader-text {
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #00a2ff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .loader-dots {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: #1a4a8a;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 100% { background: #1a4a8a; transform: scale(1); }
            50% { background: #00a2ff; transform: scale(1.3); box-shadow: 0 0 10px #00a2ff; }
        }

        /* Contenedor Principal */
        #main-app {
            display: none;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #main-app.visible {
            display: block;
            opacity: 1;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 20px;
        }

        header h1 {
            font-size: 2rem;
            letter-spacing: 4px;
            color: #00a2ff;
            margin: 0 0 10px 0;
            text-shadow: 0 0 10px rgba(0, 162, 255, 0.3);
        }

        header p {
            font-size: 0.75rem;
            color: #445566;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        /* Grilla de Botones */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding-bottom: 30px;
            margin-top: 20px;
        }

        .action-btn {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 20px;
            transition: all 0.3s ease;
            overflow: hidden;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .action-btn:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        /* Iconos y Texto */
        .action-btn svg {
            margin-bottom: 12px;
            opacity: 0.95;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        .label {
            font-weight: 900;
            font-size: 0.85rem;
            letter-spacing: 1px;
            display: block;
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .sub {
            font-size: 0.65rem;
            opacity: 0.8;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Colores dinámicos */
        .bg-emergencia {
            background: linear-gradient(135deg, #7f1d1d 0%, #dc2626 100%);
            box-shadow: 0 10px 25px rgba(127, 29, 29, 0.5);
            border-color: rgba(220, 38, 38, 0.3);
        }

        .bg-emergencia:hover {
            box-shadow: 0 15px 35px rgba(220, 38, 38, 0.6);
        }

        .bg-asistente {
            background: linear-gradient(135deg, #312e81 0%, #6366f1 100%);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .bg-asistente:hover {
            box-shadow: 0 15px 35px rgba(99, 102, 241, 0.5);
        }

        .bg-derechos {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .bg-derechos:hover {
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.5);
        }

        .bg-fiscalia {
            background: linear-gradient(135deg, #78350f 0%, #d97706 100%);
            box-shadow: 0 10px 25px rgba(217, 119, 6, 0.3);
            border-color: rgba(217, 119, 6, 0.3);
        }

        .bg-fiscalia:hover {
            box-shadow: 0 15px 35px rgba(217, 119, 6, 0.5);
        }

        .bg-ubicacion {
            background: linear-gradient(135deg, #064e3b 0%, #10b981 100%);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .bg-ubicacion:hover {
            box-shadow: 0 15px 35px rgba(16, 185, 129, 0.5);
        }

        .bg-menores {
            background: linear-gradient(135deg, #4c1d95 0%, #a855f7 100%);
            box-shadow: 0 10px 25px rgba(168, 85, 247, 0.3);
            border-color: rgba(168, 85, 247, 0.3);
        }

        .bg-menores:hover {
            box-shadow: 0 15px 35px rgba(168, 85, 247, 0.5);
        }

        .bg-defensor {
            background: linear-gradient(135deg, #134e4a 0%, #14b8a6 100%);
            box-shadow: 0 10px 25px rgba(20, 184, 166, 0.3);
            border-color: rgba(20, 184, 166, 0.3);
        }

        .bg-defensor:hover {
            box-shadow: 0 15px 35px rgba(20, 184, 166, 0.5);
        }

        .bg-simulador {
            background: linear-gradient(135deg, #7c2d12 0%, #ea580c 100%);
            box-shadow: 0 10px 25px rgba(234, 88, 12, 0.3);
            border-color: rgba(234, 88, 12, 0.3);
        }

        .bg-simulador:hover {
            box-shadow: 0 15px 35px rgba(234, 88, 12, 0.5);
        }

        .bg-info {
            background: linear-gradient(135deg, #334155 0%, #64748b 100%);
            box-shadow: 0 10px 25px rgba(100, 116, 139, 0.3);
            border-color: rgba(100, 116, 139, 0.3);
        }

        .bg-info:hover {
            box-shadow: 0 15px 35px rgba(100, 116, 139, 0.5);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #0f172a 0%, #1a202c 100%);
            border: 1px solid rgba(0, 162, 255, 0.3);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #00a2ff;
        }

        .modal-body {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-modal {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: linear-gradient(90deg, #00a2ff, #00d4ff);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 162, 255, 0.4);
        }

        .btn-secondary {
            background: rgba(100, 116, 139, 0.3);
            color: #cbd5e1;
            border: 1px solid rgba(100, 116, 139, 0.5);
        }

        .btn-secondary:hover {
            background: rgba(100, 116, 139, 0.5);
        }

        /* Responsive */
        @media (max-width: 600px) {
            header h1 {
                font-size: 1.5rem;
            }

            .grid {
                gap: 12px;
            }

            .action-btn {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Pantalla de Carga -->
    <div id="loading-screen">
        <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="#00a2ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            <circle cx="12" cy="11" r="3"></circle>
            <path d="m9 14 6-6"></path>
        </svg>
        <div class="loader-text">ESCUDO LEGAL</div>
        <div class="loader-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <!-- Aplicación Principal -->
    <div id="main-app">
        <header>
            <h1>🛡️ SISTEMA ACTIVO</h1>
            <p>PROTECCIÓN CIUDADANA EN TIEMPO REAL</p>
        </header>

        <div class="grid">
            <!-- 1. EMERGENCIA -->
            <div class="action-btn bg-emergencia" onclick="mostrarModal('emergencia')">
                <svg data-lucide="mic" size="40" stroke="currentColor" fill="none" stroke-width="2"></svg>
                <span class="label">EMERGENCIA</span>
                <span class="sub">GRABAR & ALERTAR</span>
            </div>

            <!-- 2. ASISTENTE -->
            <div class="action-btn bg-asistente" onclick="mostrarModal('asistente')">
                <svg data-lucide="bot" size="40" stroke="currentColor" fill="none" stroke-width="2"></svg>
                <span class="label">ASISTENTE</span>
                <span class="sub">VOZ EN TIEMPO REAL</span>
            </div>

            <!-- 3. CONOCE TUS DERECHOS -->
            <div class="action-btn bg-derechos" onclick="mostrarModal('derechos')">
                <svg data-lucide="book-open" size="40" stroke="currentColor" fill="none" stroke-width="2"></svg>
                <span class="label">CONOCE TUS</span>
                <span class="sub">DERECHOS</span>
            </div>

            <!-- 4. FISCALIA DE TURNO -->
            <div class="action-btn bg-fiscalia" onclick="mostrarModal('fiscalia')">
                <svg data-lucide="scale" size="40" stroke="currentColor" fill="none" stroke-width="2"></svg>
                <span class="label">FISCALÍA</span>
                <span class="sub">DE TURNO</span>
            </div>

            <!-- 5. COMPARTIR UBICACION -->
            <div class="action-btn bg-ubicacion" onclick="mostrarModal('ubicacion')">
                <svg data-lucide="map-pin" size="40" stroke="currentColor" fill="none" stroke-width="2"></svg>
                <span class="label">COMPARTIR</span>
                <span class="sub">UBICACIÓN</span>
            </div>

            <!-- 6. MENORES -->
            <div class="action-btn bg-menores" onclick="mostrarModal('menores')">
                <svg data-lucide="shield-alert" size="40" stroke="currentColor" fill="none" stroke-width="2"></svg>
                <span class="label">MENORES</span>
                <span class="sub">DERECHOS Y PROTOCOLO</span>
            </div>

            <!-- 7. DEFENSOR PUBLICO -->
            <div class="action-btn bg-defensor" onclick="mostrarModal('defensor')">
                <svg data-lucide="shield" size="40" stroke="currentColor" fill="none" stroke-width="2"></svg>
                <span class="label">DEFENSOR</span>
                <span class="sub">PÚBLICO GRATUITO</span>
            </div>

            <!-- 8. SIMULADOR -->
            <div class="action-btn bg-simulador" onclick="mostrarModal('simulador')">
                <svg data-lucide="gamepad-2" size="40" stroke="currentColor" fill="none" stroke-width="2"></svg>
                <span class="label">SIMULADOR</span>
                <span class="sub">PRACTICA TUS DERECHOS</span>
            </div>
        </div>
    </div>

    <!-- Modales -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header" id="modal-title">Título</div>
            <div class="modal-body" id="modal-body">Contenido</div>
            <div class="modal-footer">
                <button class="btn-modal btn-secondary" onclick="cerrarModal()">CERRAR</button>
                <button class="btn-modal btn-primary" onclick="confirmarAccion()">ACTIVAR</button>
            </div>
        </div>
    </div>

    <script>
        // Inicializar iconos de Lucide
        lucide.createIcons();

        // Contenido de cada modal
        const contenido = {
            emergencia: {
                titulo: '🚨 PROTOCOLO DE EMERGENCIA',
                texto: 'Se iniciará la grabación de audio encriptada. Tu ubicación GPS y este registro serán enviados a las autoridades competentes de forma automática. ¿Deseas continuar?'
            },
            asistente: {
                titulo: '🎙️ ASISTENTE DE VOZ',
                texto: 'Activa el micrófono para recibir asesoramiento en tiempo real. El asistente analizará la situación y te guiará sobre tus derechos ciudadanos.'
            },
            derechos: {
                titulo: '📚 CONOCE TUS DERECHOS',
                texto: 'Acceso a: Derechos constitucionales, libertad de circulación, derecho a no auto-incriminación, derecho a un abogado, protección contra abuso policial.'
            },
            fiscalia: {
                titulo: '⚖️ FISCALIA DE TURNO',
                texto: 'Contactaremos a la fiscalía correspondiente a tu zona. Se compartirá tu ubicación y el registro de evidencia automáticamente.'
            },
            ubicacion: {
                titulo: '📍 COMPARTIR UBICACIÓN',
                texto: 'Tu ubicación GPS será enviada a contactos de confianza. Coordenadas: -34.66, -58.51 (Lomas del Mirador, Buenos Aires)'
            },
            menores: {
                titulo: '👶 PROTECCIÓN DE MENORES',
                texto: 'Protocolo especial para menores de edad. Derecho a estar acompañado por responsable adulto, prohibición de interrogatorio sin abogado presente.'
            },
            defensor: {
                titulo: '🛡️ DEFENSOR PÚBLICO',
                texto: 'Contactaremos al Servicio de Defensa Oficial. Acceso gratuito a asesoramiento legal inmediato sin costo alguno.'
            },
            simulador: {
                titulo: '🎮 SIMULADOR DE DERECHOS',
                texto: 'Practica diferentes escenarios y aprende a reconocer violaciones de tus derechos. Modo: Patrulla policial - Control ciudadano.'
            }
        };

        function mostrarModal(tipo) {
            const config = contenido[tipo];
            document.getElementById('modal-title').textContent = config.titulo;
            document.getElementById('modal-body').textContent = config.texto;
            document.getElementById('modal').classList.add('active');
        }

        function cerrarModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function confirmarAccion() {
            alert('✅ Acción ejecutada exitosamente. El protocolo se ha iniciado.');
            cerrarModal();
        }

        // Pantalla de carga (5 segundos)
        window.addEventListener('load', function() {
            setTimeout(() => {
                const loading = document.getElementById('loading-screen');
                const app = document.getElementById('main-app');
                
                loading.classList.add('hidden');
                setTimeout(() => {
                    app.classList.add('visible');
                    lucide.createIcons();
                }, 100);
            }, 5000);
        });

        // Cerrar modal al hacer clic fuera
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                cerrarModal();
            }
        });
    </script>
</body>
</html>
