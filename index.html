<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escudo Legal - Piloto 3</title>
    <link rel="stylesheet" href="./src/index.css">
  </head>
  <body>
    <div id="root">
      <div style="background-color: #000; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: sans-serif;">
        <h1 style="color: #00a2ff; letter-spacing: 5px; margin-bottom: 10px;">ESCUDO LEGAL</h1>
        <div style="color: white; font-size: 1.2rem;">
          Cargando<span id="dots">...</span>
        </div>
      </div>
    </div>

    <script type="module" src="./src/main.tsx"></script>

    <script>
      // Animación de los puntitos mientras el navegador intenta levantar el TSX
      let dots = 0;
      setInterval(() => {
        dots = (dots + 1) % 4;
        document.getElementById('dots').innerText = '.'.repeat(dots);
      }, 500);
    </script>
  </body>
</html>
