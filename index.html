<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escudo Legal - Piloto 3</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background-color: #050a14; color: white; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        
        /* Pantalla de Carga */
        #loading-screen { position: fixed; inset: 0; background: #050a14; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; transition: opacity 0.8s ease; }
        .shield-icon { width: 120px; height: 120px; margin-bottom: 20px; filter: drop-shadow(0 0 15px #00a2ff); }
        .loader-dots { display: flex; gap: 8px; margin-top: 20px; }
        .dot { width: 10px; height: 10px; background: #1a4a8a; border-radius: 50%; animation: pulse 1.5s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse { 0%, 100% { background: #1a4a8a; transform: scale(1); } 50% { background: #00a2ff; transform: scale(1.3); box-shadow: 0 0 10px #00a2ff; } }

        /* Contenedor Principal */
        #main-app { display: none; width: 100%; max-width: 450px; padding: 15px; opacity: 0; transition: opacity 0.5s ease; }
        header { text-align: center; margin-bottom: 20px; padding-top: 10px; }
        header h1 { font-size: 1.5rem; letter-spacing: 4px; color: #00a2ff; margin: 0; }

        /* Grilla de Botones (Tu código de Replit) */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding-bottom: 30px; }
        
        .action-btn {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 15px;
            transition: transform 0.1s;
            overflow: hidden;
            text-align: center;
        }
        .action-btn:active { transform: scale(0.95); }
        
        /* Iconos y Texto */
        .action-btn i { margin-bottom: 10px; opacity: 0.9; }
        .label { font-weight: 900; font-size: 0.75rem; letter-spacing: 1px; display: block; line-height: 1; }
        .sub { font-size: 0.6rem; opacity: 0.8; font-weight: bold; margin-top: 4px; text-transform: uppercase; }

        /* Colores dinámicos del código de Replit */
        .bg-emergencia { background: linear-gradient(135deg, #7f1d1d, #ef4444); box-shadow: 0 10px 20px rgba(127, 29, 29, 0.6); border-color: rgba(239, 68, 68, 0.4); }
        .bg-asistente { background: linear-gradient(135deg, #312e81, #4f46e5); box-shadow: 0 10px 20px rgba(49, 46, 129, 0.6); border-color: rgba(79, 70, 229, 0.3); }
        .bg-derechos { background: linear-gradient(135deg, #1e3a8a, #2563eb); box-shadow: 0 10px 20px rgba(30, 58, 138, 0.6); border-color: rgba(37, 99, 235, 0.3); }
        .bg-fiscalia { background: linear-gradient(135deg, #78350f, #d97706); box-shadow: 0 10px 20px rgba(120, 53, 15, 0.6); border-color: rgba(217, 119, 6, 0.3); }
        .bg-ubicacion { background: linear-gradient(135deg, #064e3b, #10b981); box-shadow: 0 10px 20px rgba(6, 78, 59, 0.6); border-color: rgba(16, 185, 129, 0.3); }
        .bg-menores { background: linear-gradient(135deg, #4c1d95, #7c3aed); box-shadow: 0 10px 20px rgba(76, 29, 149, 0.6); border-color: rgba(124, 58, 237, 0.3); }
        .bg-defensor { background: linear-gradient(135deg, #134e4a, #14b8a6); box-shadow: 0 10px 20px rgba(19, 78, 74, 0.6); border-color: rgba(20, 184, 166, 0.3); }
        .bg-simulador { background: linear-gradient(135deg, #7c2d12, #ea580c); box-shadow: 0 10px 20px rgba(124, 45, 18, 0.6); border-color: rgba(234, 88, 12, 0.3); }
        .bg-info { background: linear-gradient(135deg, #334155, #64748b); box-shadow: 0 10px 20px rgba(51, 65, 85, 0.6); border-color: rgba(100, 116, 139, 0.3); }
    </style>
</head>
<body>

    <div id="loading-screen">
        <svg class="shield-icon" viewBox="0 0 24 24" fill="none" stroke="#00a2ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            <circle cx="12" cy="11" r="3"></circle>
            <path d="m9 14 6-6"></path>
        </svg>
        <h1>ESCUDO LEGAL</h1>
        <div class="loader-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <div id="main-app">
        <header>
            <h1>SISTEMA ACTIVO</h1>
            <p style="font-size: 0.7rem; color: #445566; margin-top: 5px;">PROTECCIÓN CIUDADANA EN TIEMPO REAL</p>
        </header>

        <div class="grid">
            <div class="action-btn bg-emergencia" onclick="alert('Iniciando Protocolo SPLITCH...')">
                <i data-lucide="mic" size="36"></i>
                <span class="label">EMERGENCIA</span>
                <span class="sub">GRABAR & ALERTAR</span>
            </div>

            <div class="action-btn bg-asistente" onclick="alert('Abriendo Asistente de Voz...')">
                <i data-lucide="bot" size="36"></i>
                <span class="label">ASISTENTE</span>
                <span class="sub">VOZ EN TIEMPO REAL</span>
            </div>

            <div class="action-btn bg-derechos" onclick="alert('Cargando base de Derechos...')">
                <i data-lucide="book-open" size="36"></i>
                <span class="label">CONOCE TUS</span>
                <span class="sub">DERECHOS</span>
            </div>

            <div class="action-btn bg-fiscalia" onclick="alert('Buscando Fiscalía de turno...')">
                <i data-lucide="scale" size="36"></i>
                <span class="label">FISCALIA</span>
                <span class="sub">DE TURNO</span>
            </div>

            <div class="action-btn bg-ubicacion" onclick="alert('Enviando ubicación GPS...')">
                <i data-lucide="map-pin" size="36"></i>
                <span class="label">COMPARTIR</span>
                <span class="sub">UBICACION</span>
            </div>

            <div class="action-btn bg-menores" onclick="alert('Protocolos de Menores...')">
                <i data-lucide="baby" size="36"></i>
                <span class="label">MENORES</span>
                <span class="sub">DERECHOS Y PROTOCOLO</span>
            </div>

            <div class="action-btn bg-defensor" onclick="alert('Contactando Defensor Público...')">
                <i data-lucide="shield" size="36"></i>
                <span class="label">DEFENSOR</span>
                <span class="sub">PUBLICO GRATUITO</span>
            </div>

            <div class="action-btn bg-simulador" onclick="alert('Iniciando Simulador...')">
                <i data-lucide="gamepad-2" size="36"></i>
                <span class="label">SIMULADOR</span>
                <span class="sub">PRACTICA TUS DERECHOS</span>
            </div>
        </div>
    </div>

    <script>
        // Inicializar iconos
        lucide.createIcons();

        // Control de carga (10 segundos exactos)
        setTimeout(() => {
            const screen = document.getElementById('loading-screen');
            const app = document.getElementById('main-app');
            
            screen.style.opacity = '0';
            setTimeout(() => {
                screen.style.display = 'none';
                app.style.display = 'block';
                setTimeout(() => app.style.opacity = '1', 50);
            }, 800);
        }, 10000);
    </script>
</body>
</html>
